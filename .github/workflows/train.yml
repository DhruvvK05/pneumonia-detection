name: Full MLOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  mlops:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install deps
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      # 4️⃣ Pull data (if using remote)
      - run: dvc pull || true

      # 5️⃣ Run pipeline (optional training)
      - run: dvc repro || true

      # 6️⃣ Check improvement
      - name: Check improvement
        run: |
          if [ -f model_improved.txt ] && grep -q "YES" model_improved.txt; then
            echo "MODEL_IMPROVED=true" >> $GITHUB_ENV
          else
            echo "MODEL_IMPROVED=false" >> $GITHUB_ENV
          fi

      # 7️⃣ Build Docker
      - name: Build Docker image
        run: docker build -t pneumonia-app .

      # 8️⃣ Login Docker Hub
      - name: Login Docker
        if: env.MODEL_IMPROVED == 'true'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 9️⃣ Push Docker image
      - name: Push Docker image
        if: env.MODEL_IMPROVED == 'true'
        run: |
          docker tag pneumonia-app ${{ secrets.DOCKER_USERNAME }}/pneumonia-app
          docker push ${{ secrets.DOCKER_USERNAME }}/pneumonia-app